# =============================================================================
#  HARDENED (OPCIONAL / referencia) - Credenciales desde AWS Secrets Manager
#  vía el Secrets Store CSI Driver + AWS Provider (ASCP).
#
#  Este es el enfoque recomendado en producción: la credencial NUNCA está en un
#  manifiesto ni en un objeto Secret de Kubernetes; se monta como archivo en el
#  pod bajo demanda y el acceso se controla con IAM (IRSA), no con RBAC de K8s.
#
#  REQUISITOS (ver README -> Hardened):
#    - Instalar el CSI driver y el AWS provider (Helm).
#    - Crear el secreto en Secrets Manager:  bluelock/db-credentials
#    - Crear un rol IAM (IRSA) con permiso secretsmanager:GetSecretValue
#      y anotarlo en el ServiceAccount.
#
#  OWASP K8s: K08 (Secrets Management Failures)
#  MITRE ATT&CK: mitiga T1552.001
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bluelock-db
  namespace: team-z-hard
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "bluelock/db-credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "db_username"
          - path: "password"
            objectAlias: "db_password"
          - path: "database"
            objectAlias: "db_name"
# Para usarlo, el pod monta un volumen csi secrets-store.csi.k8s.io con
# volumeAttributes.secretProviderClass: bluelock-db  (ejemplo en el README).
